<div class="flex flex-col gap-1">
  <label *ngIf="label" class="text-[var(--text-on-bg-layout)] font-medium">
    {{ label }}
  </label>

  <div class="flex items-center relative">
    <!-- Si existe un icono -->
    <span *ngIf="icon" class="absolute left-3" [innerHTML]="icon"></span>

    <input
      [type]="type"
      [placeholder]="placeholder"
      [value]="value"
      [ngStyle]="{
        'font-size': fontSize,
        border: '1px solid ' + borderColor,
        color: textColor,
        'background-color': bgColor,
        'padding-left': icon ? '2.5rem' : '0.75rem'
      }"
      [ngClass]="
        rounded +
        ' focus:outline-none focus:ring-2 focus:ring-[var(--border-color)] transition-colors ' +
        padding +
        ' placeholder-gray-400 w-full'
      "
      (input)="onInput($event)"
      (keydown)="onKeyDown($event)"
      (blur)="onBlur()"
    />
  </div>
</div>
