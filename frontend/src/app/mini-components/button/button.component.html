<button
  class="flex items-center rounded-lg gap-1 transition-colors"
  [type]="htmlType"
  [disabled]="disabled"
  [ngClass]="padding"
  [ngStyle]="{
    'background-color': hover
      ? hoverBgColor ?? hoverColor(background)
      : background,
    color: hover ? hoverTextColor ?? color : color,
    'font-size': font,
    opacity: disabled ? 0.5 : 1,
    cursor: disabled ? 'not-allowed' : 'pointer'
  }"
  (mouseenter)="hover = true"
  (mouseleave)="hover = false"
>
  <span class="inline-flex items-center gap-2">
    <span *ngIf="icon" [innerHTML]="icon" class="pointer-events-none"></span>
    <span *ngIf="label">{{ label }}</span>
  </span>
</button>
