<div class="flex flex-col gap-1">
  <label *ngIf="label" class="text-[var(--text-on-bg-layout)] font-medium">
    {{ label }}
  </label>

  <div class="flex items-center relative w-full">
    <!-- Ícono de carpeta fijo -->
    <span
      class="absolute left-3 flex items-center text-[var(--text-on-bg-layout)]"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v8a2 
             2 0 01-2 2H5a2 2 0 01-2-2V7z"
        />
      </svg>
    </span>

    <!-- Botón estilizado -->
    <button
      type="button"
      (click)="fileInput.click()"
      [ngStyle]="{
        'font-size': fontSize,
        border: '1px solid ' + borderColor,
        color: textColor,
        'background-color': bgColor,
        'padding-left': '2.5rem'
      }"
      [ngClass]="
        rounded +
        ' focus:outline-none focus:ring-2 focus:ring-[var(--border-color)] transition-colors ' +
        padding +
        ' placeholder-gray-400 w-full text-left'
      "
    >
      {{ value ? value.name : "Seleccione un archivo" }}
    </button>

    <!-- Input real oculto -->
    <input
      type="file"
      [accept]="accept"
      #fileInput
      (change)="onFileSelected($event)"
      (blur)="touched = true"
      class="hidden"
    />
  </div>

  <!-- Error -->
  <p *ngIf="showError" class="text-red-600 text-sm mt-1">
    {{ requiredMessage || "Este campo es obligatorio" }}
  </p>
</div>
