<!-- layout.component.html -->
<app-top-alert></app-top-alert>
<app-pop-alert></app-pop-alert>

<div class="h-screen flex flex-col">
  <!-- Topbar -->
  <div *ngIf="showTopbar">
    <app-topbar (toggleSidebar)="toggleSidebar()"></app-topbar>
  </div>

  <!-- Contenedor principal -->
  <div class="flex flex-1 pt-[64px]">
    <!-- Leftbar -->
    <div
      [class.-translate-x-64]="!showLeftbar"
      class="transition-transform duration-3000"
    >
      <app-leftbar></app-leftbar>
    </div>

    <!-- Main content -->
    <main
      class="flex-1 p-4 overflow-y-auto h-[calc(100vh-64px)] transition-all duration-300 bg-[var(--layout-bg)]"
      [class.ml-64]="showLeftbar"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
