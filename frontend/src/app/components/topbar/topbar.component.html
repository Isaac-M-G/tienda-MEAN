<!-- Topbar fijo y scrollable -->
<nav
  class="fixed top-0 left-0 right-0 h-16 bg-[var(--topbar-bg)] text-[var(--topbar-text)] flex items-center px-4 shadow-md z-50 overflow-x-auto"
>
  <div class="flex items-center gap-4 flex-shrink-0">
    <!-- Botón hamburguesa -->
    <app-button
      (click)="toggleSidebar.emit()"
      [customSvg]="globalVariables.icons.hamburguer"
      hoverBgColor="var(--secondary)"
      hoverTextColor="var(--text-on-bg-secondary)"
      bgColor="transparent"
      padding="p-2"
    >
    </app-button>

    <p class="text-xl font-bold flex-shrink-0">Mi Proyecto</p>
  </div>

  <!-- Menú horizontal scrollable -->
  <ul class="flex gap-4 ml-auto whitespace-nowrap items-center">
    <li *ngFor="let item of menuItems">
      <a
        [routerLink]="item.link"
        class="hover:underline hover:text-[var(--topbar-text-hover)] transition-colors duration-300"
      >
        {{ item.label }}
      </a>
    </li>

    <li *ngIf="isLoggedIn()">
      <a
        (click)="logout()"
        class="hover:underline hover:text-[var(--topbar-text-hover)] transition-colors duration-300 cursor-pointer"
      >
        Logout
      </a>
    </li>

    <!-- Botón de configuración con dropdown -->
    <li class="relative">
      <app-button
        (click)="toggleSettingsDropdown()"
        [customSvg]="globalVariables.icons.settings"
        iconSize="24"
        bgColor="transparent"
        hoverBgColor="var(--secondary)"
        hoverTextColor="var(--text-on-bg-secondary)"
        padding="p-2"
      ></app-button>

      <!-- Dropdown de opciones  -->
      <ul
        *ngIf="settingsDropdownOpen"
        class="fixed top-[70px] right-4 w-48 bg-[var(--topbar-bg)] text-[var(--topbar-text)] rounded-lg shadow-xl overflow-hidden border-[4px] border-[var(--topbar-bg)]"
      >
        <li
          class="px-4 py-2 hover:bg-[var(--topbar-text)] hover:text-[var(--topbar-bg)] cursor-pointer transition-colors"
          (click)="nextTheme(); settingsDropdownOpen = false"
        >
          Cambiar Tema ({{ currentTheme }})
        </li>
        <li
          class="px-4 py-2 hover:bg-[var(--topbar-text)] hover:text-[var(--topbar-bg)] cursor-pointer transition-colors"
          (click)="goToProfile(); settingsDropdownOpen = false"
        >
          Ver Perfil
        </li>
      </ul>
    </li>
  </ul>
</nav>
