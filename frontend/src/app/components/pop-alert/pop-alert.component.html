<div
  *ngIf="alert$ | async as alert"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  (click)="cancel(alert)"
>
  <div
    class="bg-[var(--layout-bg)] rounded-xl shadow-2xl min-h-[200px] min-w-[250px] w-96 flex flex-col justify-between p-8"
    (click)="$event.stopPropagation()"
  >
    <!-- Mensaje centrado -->
    <div
      class="flex flex-col flex-grow justify-center items-center text-center"
    >
      <p
        class="text-[var(--title-on-bg-layout)] text-xl font-semibold leading-relaxed px-4"
      >
        {{ alert.message }}
      </p>
    </div>

    <!-- Botones abajo -->
    <div class="flex justify-end gap-3 mt-6">
      <app-button
        (click)="cancel(alert)"
        bgColor="#e72828"
        textColor="white"
        [label]="alert.cancelText || 'Cancelar'"
        fontSize="text-sm"
      ></app-button>
      <app-button
        (click)="confirm(alert)"
        [label]="alert.confirmText || 'Confirmar'"
        fontSize="text-sm"
      ></app-button>
    </div>
  </div>
</div>
