<div class="max-w-md mx-auto">
  <app-form
    [fields]="formFields"
    (formReady)="onFormReady($event)"
    [submitLabel]="'Guardar Cambios'"
    [cancelLabel]="'Cancelar'"
    (submitted)="onSubmit($event)"
    (cancelled)="onCancel()"
    width="w-full"
    padding="p-4"
  ></app-form>

  <!-- Mostrar imagen actual -->
  <div *ngIf="currentImageUrl" class="mt-2 text-center">
    <p class="text-sm text-gray-600">Imagen actual:</p>
    <img
      [src]="currentImageUrl"
      alt="Imagen actual"
      class="h-32 w-auto border rounded mx-auto"
    />
  </div>
</div>
