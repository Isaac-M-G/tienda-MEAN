<div class="max-w-md mx-auto">
  <!-- Formulario genérico -->
  <app-form
    [fields]="formFields"
    (formReady)="form = $event"
    [submitLabel]="'Crear Producto'"
    [cancelLabel]="'Cancelar'"
    (submitted)="onSubmit($event)"
    (cancelled)="onCancel()"
    width="w-full"
  ></app-form>
</div>
