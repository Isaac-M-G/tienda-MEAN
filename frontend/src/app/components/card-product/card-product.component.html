<div
  class="product-card bg-[var(--layout-bg)] rounded-2xl overflow-hidden w-full h-full flex flex-col cursor-pointer card-shadow"
  (dblclick)="goToDetail()"
>
  <!-- Imagen -->
  <div class="product-image-container flex justify-center items-center p-4">
    <img
      [src]="imageUrl"
      alt="{{ title }}"
      class="product-image h-[140px] w-auto object-contain max-w-full"
    />
  </div>

  <!-- Contenido -->
  <div class="product-content p-4 flex flex-col flex-grow">
    <!-- Título -->
    <span class="product-title text-xl font-bold tracking-wide text-gray-900 mb-2 line-clamp-2">
      {{ title }}
    </span>

    <!-- Descripción -->
    <p class="product-description text-gray-600 mb-3 text-sm line-clamp-2 flex-grow">
      {{ description }}
    </p>

    <!-- Categoría -->
    <!-- <p class="text-sm text-gray-500 italic mb-2">
      Categoría: {{ category || "No especificada" }}
    </p> -->

    <!-- Precio -->
    <p class="product-price text-xl font-mono font-extrabold text-green-600 mb-3">
      ${{ price }}
    </p>

    <!-- Acciones -->
    <div class="product-actions mt-auto flex flex-col gap-2">
      <!-- Agregar al carrito -->
      <app-add-to-cart [product]="getProduct()"></app-add-to-cart>
      
      <!-- Botones de navegación y admin -->
      <div class="admin-buttons flex items-center justify-between">
        <!-- Botón ver más -->
        <app-button
          (click)="goToDetail()"
          label="Ver más"
          hoverBgColor="black"
          hoverTextColor="white"
        >
        </app-button>

        <!-- Botones admin -->
        <div class="flex gap-1" *ngIf="isAdmin">
          <app-button type="edit" (click)="onEdit()"></app-button>
          <app-button type="delete" (click)="onDelete()"></app-button>
        </div>
      </div>
    </div>
  </div>
</div>
